dle" dominant-baseline="central" font-size="12" fill="#185FA5">Silence, practice, story</text><rect x="444" y="186" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/><text x="529.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Inner work</text><text x="529.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Leadings, rest, care</text><path d="M340 276 L340 314" fill="none" stroke="#3D4B59" stroke-width="1.5" marker-end="url(#ah)"/><rect x="180" y="316" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="310.0" y="334.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Accompaniment</text><text x="310.0" y="355.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Prepare, wait, follow</text><path d="M270 372 L270 410" fill="none" stroke="#3D4B59" stroke-width="1.5" marker-end="url(#ah)"/><path d="M350 410 L350 374" fill="none" stroke="#3D4B59" stroke-width="1.5" marker-end="url(#ah)"/><text x="260" y="392" text-anchor="end" dominant-baseline="central" font-size="12" fill="#3D4B59">Work, money, presence, land</text><text x="360" y="392" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D4B59">Direction and knowledge</text><rect x="180" y="412" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="310.0" y="430.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Partner</text><text x="310.0" y="451.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Affected community leads it</text><path d="M440 440 L478 440" fill="none" stroke="#3D4B59" stroke-width="1.5" marker-end="url(#ah)"/><rect x="480" y="412" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="560.0" y="430.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Public spaces</text><text x="560.0" y="451.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Only when asked</text><path d="M310 468 L310 506" fill="none" stroke="#3D4B59" stroke-width="1.5" marker-end="url(#ah)"/><rect x="180" y="508" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="310.0" y="526.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Reflection after action</text><text x="310.0" y="547.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Notice, reflect, learn, return</text><path d="M180 536 L60 536 L60 278" fill="none" stroke="#3D4B59" stroke-width="1.5" marker-end="url(#ah)"/><text x="72" y="490" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D4B59">Returns to the group</text><rect x="60" y="593" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/><text x="82" y="600" dominant-baseline="central" font-size="12" fill="#2C2C2A">Friends and the group</text><rect x="260" y="593" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="282" y="600" dominant-baseline="central" font-size="12" fill="#2C2C2A">The community and public places</text><rect x="500" y="593" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="522" y="600" dominant-baseline="central" font-size="12" fill="#2C2C2A">Sources and steps</text>
