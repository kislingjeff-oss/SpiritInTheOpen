<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img" font-family="'IBM Plex Sans', Arial, sans-serif">
<title>Spirit in the Open: the main parts of the model and how they connect</title>
<desc>Two sources, the AFSC model and Jeff Kisling's writings, form the group. The group has a covenant, a gathering and inner work. Through accompaniment, the group gives work, money, presence and land to the partner, and the partner gives direction and knowledge back. The group offers practice in public spaces only when the partner asks. Reflection after each action returns to the group.</desc>
